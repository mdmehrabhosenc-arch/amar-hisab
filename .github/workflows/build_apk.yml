name: Build Amar Hisab APK

on:
workflow_dispatch:
push:
branches: [main, master]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Locate Flutter project
    run: |
      if [ -f "pubspec.yaml" ]; then
        echo "PROJECT_DIR=." >> "$GITHUB_ENV"
      elif [ -f "amar_hisab_flutter_source (1)/pubspec.yaml" ]; then
        echo "PROJECT_DIR=amar_hisab_flutter_source (1)" >> "$GITHUB_ENV"
      else
        echo "Flutter project pubspec.yaml not found"
        exit 1
      fi

  - name: Generate Android project files
    run: |
      cd "$PROJECT_DIR"
      flutter create . --platforms=android --org com.amarhisab --project-name amar_hisab

  - name: Install dependencies
    run: |
      cd "$PROJECT_DIR"
      flutter pub get

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: amar-hisab-apk
      path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
