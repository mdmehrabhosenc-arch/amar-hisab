name: Build Amar Hisab APK

on:
workflow_dispatch:
push:
branches: [main, master]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Locate Flutter project
            PROJECT_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        echo "project_dir=${PROJECT_PATH:-.}" >> "$GITHUB_OUTPUT"
      
      exit 1
      fi

  - name: Generate Android project files
    run: |
      cd "$PROJECT_DIR"
  - name: Install dependencies
    run: |
      cd "$PROJECT_DIR"
      flutter pub get

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: amar-hisab-apk
      path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
